# Fetch forecasts, build the page and deploy to Cloudflare Pages (project "lift-chaser").
# Times are UTC. Open-Meteo GFS updates every 6 h; RASP runs finish overnight.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: update-forecasts
on:
  schedule:
    - cron: "15 10,16,22 * * *"   # 06:15, 12:15, 18:15 EDT
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/**", "site/template.html", "scripts/**", ".github/workflows/**"]
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Start from the deployed cache, so a failed fetch keeps the last good forecast
      # (the page flags it stale after 12 h) instead of publishing none.
      - name: Seed cache from the live site
        run: |
          mkdir -p cache/openmeteo
          for f in sites grid_ne grid_east grid_conus; do
            curl -fsS -o "cache/openmeteo/$f.json" "https://lift-chaser.pages.dev/cache/openmeteo/$f.json" \
              && python -c "import json,sys; json.load(open(sys.argv[1]))" "cache/openmeteo/$f.json" \
              || rm -f "cache/openmeteo/$f.json"
          done
      # Add --rasp here once Steve Paavola has agreed to automated fetches.
      - run: python scripts/fetch_forecasts.py
      - run: python scripts/build_site.py
      - run: mkdir -p public && cp site/index.html public/ && cp -r cache public/ && rm -f public/cache/.gitkeep
      - name: Create the Pages project if it does not exist yet
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create lift-chaser --production-branch=main
        continue-on-error: true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=lift-chaser --branch=main
